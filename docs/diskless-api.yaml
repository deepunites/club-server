openapi: 3.1.0
info:
  title: Club diskless API
  version: 1.0.0
  description: |
    API бездиска между сервером клуба и помощником бездиска на ПК (служба Windows). Не зависит от шелла: касса,
    игроки и сессии — зона шелла, здесь только машины и том библиотеки игр.

    - JSON: camelCase, время `2026-09-27T10:15:30.123Z`, null не передаётся.
    - Ошибки: `{ "error": { "code", "message", "details", "traceId" } }`.
    - Доступ: регистрация по `X-Club-Key`; дальше `Authorization: Bearer <accessToken>` (JWT, ~1 ч) и одноразовый
      refresh. Только HTTPS в клубе.
    - Помощник монтирует том всегда read-only. Сервер никогда не управляет Windows напрямую: помощник сам опрашивает
      состояние и сообщает факты.
servers:
  - url: https://{host}/diskless/v1
    variables:
      host:
        default: club-server
paths:
  /machines/register:
    post:
      operationId: registerMachine
      summary: Регистрация ПК (по HWID; номер места выдаёт сервер)
      security:
        - clubKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineRegisterRequest'
      responses:
        '200':
          description: Машина зарегистрирована или узнана по HWID; прежние токены отозваны.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MachineRegisterResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          description: '`pendingApproval` — машина в реестре, ждёт одобрения администратора.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /machines/refresh:
    post:
      operationId: refreshMachineToken
      summary: Новый access-токен; refresh одноразовый, повтор отзывает все токены машины
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Новая пара токенов.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
        '401':
          $ref: '#/components/responses/Error'
  /machines/{machineId}/volume:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    get:
      operationId: getVolume
      summary: Какой том библиотеки монтировать сейчас
      security:
        - machineBearer: []
      responses:
        '200':
          description: Текущая опубликованная версия библиотеки.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VolumeAssignment'
        '204':
          description: Тома нет (библиотека не опубликована) — помощник ничего не монтирует.
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /machines/{machineId}/status:
    parameters:
      - $ref: '#/components/parameters/MachineId'
    put:
      operationId: reportStatus
      summary: Факты с ПК (раз в ~30 с) и в ответ — актуальный том
      security:
        - machineBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachineStatus'
      responses:
        '200':
          description: Принято. `volume` отсутствует, если тома нет.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusAccepted'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
webhooks:
  machinesSnapshot:
    post:
      operationId: machinesSnapshot
      summary: Список ПК → внешняя система (шелл, касса); отправляет сервер клуба
      description: |
        Сервер клуба сам отправляет POST на адрес из настройки `MachineFeed:Url` (подробно — docs/machine-feed.md).
        Работает через NAT: получатель может быть в облаке.

        - Всегда **полный** список одобренных ПК. ПК, которого нет в снимке, удалён или ещё не одобрен.
        - Отправка при изменении (не позже `MachineFeed:IntervalSec`, 10 с) и повтор неизменного списка раз в
          `MachineFeed:ResendMinutes` (10 мин).
        - Ответ 2xx — принято. Любой другой ответ, таймаут 15 с или обрыв — повтор через 10 с, 20 с, 40 с … 5 мин.
          Редиректы не выполняются.
        - Подпись: `X-Club-Signature: v1=` + hex(HMAC-SHA256(секрет, `{X-Club-Timestamp}.{тело запроса как есть}`)).
          Получатель проверяет подпись по сырым байтам тела, отклоняет метку времени старше 5 минут и снимки с
          `generatedAt` раньше уже применённого.
        - Новые поля могут появиться в любой версии `club-server.machines/1`: неизвестные поля нужно пропускать.
      parameters:
        - name: X-Club-Timestamp
          in: header
          required: true
          description: Unix-время отправки в секундах.
          schema:
            type: string
            pattern: '^[0-9]{1,12}$'
        - name: X-Club-Signature
          in: header
          required: true
          schema:
            type: string
            pattern: '^v1=[0-9a-f]{64}$'
        - name: X-Club-Event
          in: header
          required: true
          schema:
            const: machines.snapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MachinesSnapshot'
      responses:
        '2XX':
          description: Снимок принят (тело ответа не читается).
        default:
          description: Не принят — сервер клуба повторит позже.
components:
  securitySchemes:
    clubKey:
      type: apiKey
      in: header
      name: X-Club-Key
    machineBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MachineId:
      name: machineId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: Ошибка.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    MachineRegisterRequest:
      type: object
      required: [hwid, hostname, macAddresses, helperVersion]
      properties:
        hwid:
          type: string
          minLength: 1
          description: Стабильный идентификатор железа (sha256 hex); смена железа = новая машина.
        hostname:
          type: string
          minLength: 1
        macAddresses:
          type: array
          minItems: 1
          description: |
            MAC Ethernet-карт в нижнем регистре; первым — основная карта (с IPv4-шлюзом), по нему сервер резервирует IP
            места в DHCP. Нужны для DHCP/PXE и перезаливки.
          items:
            type: string
            pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
        helperVersion:
          type: string
        osVersion:
          type: string
    MachineRegisterResponse:
      type: object
      required: [machineId, number, name, zone, accessToken, refreshToken, expiresAt, serverTime]
      properties:
        machineId:
          type: string
          format: uuid
        number:
          type: integer
          minimum: 1
          description: Номер места.
        name:
          type: string
        zone:
          type: string
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        serverTime:
          type: string
          format: date-time
    RefreshRequest:
      type: object
      required: [refreshToken, hwid]
      properties:
        refreshToken:
          type: string
        hwid:
          type: string
    RefreshResponse:
      type: object
      required: [accessToken, refreshToken, expiresAt]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresAt:
          type: string
          format: date-time
    VolumeAssignment:
      type: object
      required: [libraryVersion, portal, targetIqn, readOnly, driveLetter]
      properties:
        libraryVersion:
          type: string
          description: Метка версии библиотеки (например 2026-09).
        portal:
          type: string
          description: Портал iSCSI, `host:port`.
        targetIqn:
          type: string
        readOnly:
          type: boolean
          const: true
          description: Том общий для всех ПК — только чтение.
        driveLetter:
          type: string
          pattern: '^[D-Z]$'
    VolumeState:
      type: string
      enum: [none, mounting, mounted, switchPending, failed]
      description: |
        none — тома нет или отключён; mounting — подключение идёт; mounted — смонтирован и read-only проверен;
        switchPending — есть новая версия, но старый том занят запущенной игрой; failed — ошибка, см. error.
    MountedVolume:
      type: object
      required: [state]
      properties:
        state:
          $ref: '#/components/schemas/VolumeState'
        targetIqn:
          type: string
        libraryVersion:
          type: string
        driveLetter:
          type: string
        readOnlyVerified:
          type: boolean
          description: Диск на ПК подтверждённо read-only (атрибут диска), а не только по настройке.
        error:
          type: string
        contents:
          type: array
          maxItems: 1000
          description: >-
            Папки верхнего уровня тома (без скрытых и системных) — «состав» версии библиотеки для панели. Помощник шлёт
            их один раз после подключения версии. Сервер принимает только при state=mounted и readOnlyVerified=true.
          items:
            type: string
            maxLength: 255
    MachineStatus:
      type: object
      required: [helperVersion, volume]
      properties:
        helperVersion:
          type: string
        bootTime:
          type: string
          format: date-time
        volume:
          $ref: '#/components/schemas/MountedVolume'
        dhcpServers:
          type: array
          maxItems: 8
          description: >-
            IPv4-адреса DHCP-серверов, выдавших текущие аренды поднятых Ethernet-карт. Сервер сравнивает их со своим
            DHCP: чужой адрес — предупреждение «чужой DHCP в сети клуба». Поле необязательное; не прислано — прежнее
            значение сохраняется, пустой массив — ПК аренд не имеет (статический адрес).
          items:
            type: string
            format: ipv4
        imageVersion:
          type: string
          pattern: '^[a-z0-9][a-z0-9._-]{0,39}$'
          description: >-
            Версия образа Windows на ПК — метка из %ProgramData%\ClubDiskless\image.json, который пишет WinPE при
            заливке. Сервер закрывает задание перезаливки, когда Windows выходит на связь с нужной версией.
        systemDisk:
          $ref: '#/components/schemas/SystemDisk'
        secureBoot:
          $ref: '#/components/schemas/SecureBoot'
        initiatorIqn:
          type: string
          maxLength: 223
          description: >-
            Имя iSCSI-инициатора Windows (Get-InitiatorPort). По нему сервер пускает к мастер-тому только ПК
            суперклиента (вместе с CHAP).
        master:
          $ref: '#/components/schemas/MasterReport'
    MasterReport:
      type: object
      description: >-
        Мастер-том на ПК суперклиента — факт с ПК. Помощник присылает его, только когда мастер-том назначен ПК или
        подключён на нём (none — в такте, где помощник его отключил). Отчёт без master означает «мастер-том не
        подключён»: сервер сбрасывает прежнее состояние. Незнакомое state сервер пропускает, прежнее не меняет.
      required: [state]
      properties:
        state:
          type: string
          enum: [none, mounting, mounted, failed]
        targetIqn:
          type: string
        driveLetter:
          type: string
        error:
          type: string
    MasterAssignment:
      type: object
      description: >-
        Мастер-том библиотеки на запись. Приходит только ПК, которому администратор открыл правку, и только пока
        правка открыта. Секрет CHAP новый на каждое открытие. Назначение пропало — помощник сбрасывает кэш тома на
        диск, переводит диск offline и отключает таргет; сервер закрывает доступ только после отключения.
      required: [targetIqn, portal, chapUser, chapSecret, driveLetter]
      properties:
        targetIqn:
          type: string
        portal:
          type: string
          description: host:port
        chapUser:
          type: string
        chapSecret:
          type: string
          minLength: 12
          maxLength: 16
        driveLetter:
          type: string
          pattern: '^[A-Z]$'
    SecureBoot:
      type: object
      description: >-
        Secure Boot на ПК — для перезаливки по сети. Проверки из руководства Microsoft по CVE-2023-24932: строки
        сертификатов в переменных db и dbx. null — неизвестно (Legacy BIOS или нет прав). По этим фактам сервер
        отказывает заранее, если подписанная цепочка не загрузится, и выбирает загрузчик Windows для WinPE.
      properties:
        enabled:
          type: [boolean, 'null']
          description: Confirm-SecureBootUEFI.
        thirdPartyCa2011:
          type: [boolean, 'null']
          description: В db есть «Microsoft Corporation UEFI CA 2011» — им подписан shim iPXE.
        windowsCa2023:
          type: [boolean, 'null']
          description: В db есть «Windows UEFI CA 2023».
        pca2011Revoked:
          type: [boolean, 'null']
          description: В dbx «Microsoft Windows Production PCA 2011» — старые загрузчики Windows отозваны.
    SystemDisk:
      type: object
      description: >-
        Диск, с которого загружена Windows (Get-Disk). При перезаливке WinPE стирает только диск с этим серийным
        номером: второй диск или флешка не пострадают.
      required: [sizeBytes, busType]
      properties:
        serial:
          type: string
          maxLength: 128
        model:
          type: string
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
        busType:
          type: string
          examples: [NVMe, SATA, SAS, RAID]
    StatusAccepted:
      type: object
      required: [serverTime]
      properties:
        serverTime:
          type: string
          format: date-time
        volume:
          $ref: '#/components/schemas/VolumeAssignment'
        master:
          $ref: '#/components/schemas/MasterAssignment'
    MachinesSnapshot:
      type: object
      required: [schema, generatedAt, contentHash, machines]
      properties:
        schema:
          const: club-server.machines/1
        generatedAt:
          type: string
          format: date-time
          description: Когда снят список; более ранний снимок, пришедший позже, получатель пропускает.
        contentHash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: sha256 списка машин; совпадает — список не изменился.
        machines:
          type: array
          description: Одобренные ПК по возрастанию номера места.
          items:
            $ref: '#/components/schemas/MachineFeedEntry'
    MachineFeedEntry:
      type: object
      required: [id, number, name, hostname, macAddresses]
      properties:
        id:
          type: string
          format: uuid
          description: Идентификатор машины в сервере клуба; не меняется, пока машина в реестре.
        number:
          type: integer
          minimum: 1
          maximum: 9999
          description: Номер места; сервер клуба главный для номера и имени (от номера зависят IP и имя ПК в DHCP).
        name:
          type: string
          minLength: 1
          maxLength: 64
          description: Имя места в панели (`PC-01`).
        hostname:
          type: string
          description: Имя Windows, которое сообщил помощник бездиска.
        macAddresses:
          type: array
          minItems: 1
          description: MAC сетевых карт в нижнем регистре с двоеточиями, по возрастанию — ключ связи с реестром получателя.
          items:
            type: string
            pattern: '^[0-9a-f]{2}(:[0-9a-f]{2}){5}$'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, traceId]
          properties:
            code:
              type: string
            message:
              type: string
            details: {}
            traceId:
              type: string
